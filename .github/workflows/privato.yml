# LIVETROPOVHF - versione privata con la linguetta Previsioni (ramo "privato").
# Compila Windows 64 bit, cifra il pacchetto con la chiave pubblica .github/privato.pub.pem e lo mette nel ramo ci-priv:
# senza la chiave privata il file non si può aprire. Nessuna Release pubblica.
name: privato

on:
  push:
    branches: [ privato ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compila
        shell: bash
        run: |
          set -o pipefail
          dotnet publish TropoVHF/TropoVHF.csproj -c Release -r win-x64 --self-contained true -p:Version=1.0.4 -p:DebugType=none -o publish/win-x64 -clp:NoSummary 2>&1 | tee build.log
      - name: Errori di compilazione (ramo ci-log)
        if: failure()
        shell: bash
        run: |
          grep -E ": error |error NU|error MSB" build.log | sort -u > errori.txt || true
          cp build.log tutto.txt
          git config user.name "IC8TEM"; git config user.email "ic8tem@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          git add -f errori.txt tutto.txt
          git commit -m "errori di compilazione versione privata ($GITHUB_SHA)"
          git push -f origin ci-log
      - name: Prova di avvio
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\prova"
          Copy-Item -Recurse publish\win-x64 $d
          Set-Content "$d\LIVETROPOVHF.ini" "call=IC8TEM`r`nloc=JN70CN`r`nupdates=0`r`nwin_max=1"
          $p = Start-Process "$d\LIVETROPOVHF.exe" -PassThru
          Start-Sleep 20
          $alive = -not $p.HasExited
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Content dist\avvio.txt "in esecuzione dopo 20 s: $alive"
          if (Test-Path "$d\errore-avvio.txt") { Copy-Item "$d\errore-avvio.txt" dist\ }
          if ($alive) { Stop-Process -Id $p.Id -Force }
      - name: Prova delle fonti dati (Open-Meteo GFS e SRTM1)
        shell: bash
        continue-on-error: true
        run: |
          set +e +o pipefail
          V="surface_pressure,temperature_2m,relative_humidity_2m,wind_speed_10m,boundary_layer_height,cape"
          for p in 1000 975 950 925 900 850 800 700 600 500; do V="$V,temperature_${p}hPa,relative_humidity_${p}hPa"; done
          U="https://api.open-meteo.com/v1/forecast?latitude=40.9,45.5&longitude=14.3,9.2&hourly=$V&models=gfs_seamless&forecast_hours=78&wind_speed_unit=ms&timezone=GMT"
          C=$(curl -s -o om.json -w "%{http_code}" "$U"); echo "Open-Meteo HTTP $C" >> dist/avvio.txt
          head -c 600 om.json >> dist/avvio.txt; echo >> dist/avvio.txt
          python -c "import json;d=json.load(open('om.json'));d=d if isinstance(d,list) else [d];h=d[0]['hourly'];print('elev',d[0].get('elevation'),'ore',len(h['time']),'nulli 975',sum(1 for x in h['temperature_975hPa'] if x is None),'blh',h['boundary_layer_height'][:3],'cape',h['cape'][:3])" >> dist/avvio.txt 2>&1 || echo "json non leggibile" >> dist/avvio.txt
          C=$(curl -s -o t.gz -w "%{http_code}" https://s3.amazonaws.com/elevation-tiles-prod/skadi/N40/N40E014.hgt.gz); echo "SRTM1 HTTP $C gz $(wc -c < t.gz) hgt $(gunzip -c t.gz 2>/dev/null | wc -c)" >> dist/avvio.txt
          cat dist/avvio.txt
      - name: Zip e cifratura
        shell: bash
        run: |
          mkdir -p dist
          (cd publish/win-x64 && 7z a -tzip -mx=7 ../../dist/LIVETROPOVHF-1.0.4-privata-windows-x64.zip . > /dev/null)
          openssl rand -out dist/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in dist/LIVETROPOVHF-1.0.4-privata-windows-x64.zip -out dist/pacchetto.enc -pass file:dist/k.bin
          openssl pkeyutl -encrypt -pubin -inkey .github/privato.pub.pem -pkeyopt rsa_padding_mode:oaep -in dist/k.bin -out dist/chiave.enc
          rm dist/k.bin dist/LIVETROPOVHF-1.0.4-privata-windows-x64.zip
          ls -la dist
      - name: Ramo ci-priv
        shell: bash
        run: |
          git config user.name "IC8TEM"; git config user.email "ic8tem@users.noreply.github.com"
          git checkout --orphan ci-priv
          git rm -rf --cached . > /dev/null
          git add -f dist/pacchetto.enc dist/chiave.enc dist/avvio.txt
          [ -f dist/errore-avvio.txt ] && git add -f dist/errore-avvio.txt || true
          git commit -m "versione privata cifrata ($GITHUB_SHA)"
          git push -f origin ci-priv
