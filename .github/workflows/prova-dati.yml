# Prova di accesso agli archivi (meteo e collegamenti). Non compila nulla: scrive i risultati nel ramo ci-dati.
name: prova-dati
on:
  push:
    branches: [ prova-dati ]
permissions:
  contents: write
jobs:
  dati:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove
        shell: bash
        run: |
          set +e
          O=$PWD/esito.txt; : > $O
          t() { local c; c=$(curl -sL --max-time 90 -A "LIVETROPOVHF-prova (IC8TEM)" -o body.bin -w "%{http_code} %{size_download}" "$2"); echo "== $1: HTTP $c" >> $O; head -c ${3:-400} body.bin | tr -d '\000' >> $O; echo >> $O; }
          # MMMonVHF: archivio dei rapporti tropo
          t "MMMonVHF robots" "https://www.mmmonvhf.de/robots.txt" 600
          t "MMMonVHF disclaimer" "https://www.mmmonvhf.de/disclaimer.php" 10
          python3 -c "import re,html;t=open('body.bin',encoding='utf-8',errors='ignore').read();t=re.sub(r'<[^>]+>',' ',t);t=html.unescape(re.sub(r'\s+',' ',t));i=t.find('Disclaimer');print('   ',t[i:i+1500])" >> $O
          t "MMMonVHF giorno 29/12/2021" "https://www.mmmonvhf.de/tr.php?year=2021&month=12&day=29" 10
          cp body.bin giorno.html
          python3 -c "import re,html;t=open('giorno.html',encoding='utf-8',errors='ignore').read();t=re.sub(r'<(script|style)[^>]*>.*?</\1>',' ',t,flags=re.S);t=re.sub(r'<br\s*/?>','\n',t);t=re.sub(r'<[^>]+>',' ',t);t=html.unescape(t);t=re.sub(r'[ \t]+',' ',t);t=re.sub(r'\n\s*\n+','\n',t);i=t.find('IC8TEM');print('   lunghezza testo',len(t));print(t[max(0,i-3000):i+800])" >> $O
          t "MMMonVHF mirror .eu" "https://www.mmmonvhf.eu/tr.php?year=2021&month=12&day=29" 200
          # IGRA2: elenco file e Brindisi
          t "IGRA2 data-y2d elenco" "https://www.ncei.noaa.gov/data/integrated-global-radiosonde-archive/access/data-y2d/" 10
          grep -o 'ITM000163[0-9]*[^"]*zip' body.bin | sort -u | head >> $O
          t "IGRA2 data-por elenco" "https://www.ncei.noaa.gov/data/integrated-global-radiosonde-archive/access/data-por/" 10
          grep -o 'ITM000163[0-9]*[^"]*zip' body.bin | sort -u | head >> $O
          grep -o 'ITM0001[0-9]*[^"]*zip' body.bin | sort -u | head -40 | tr '\n' ' ' >> $O; echo >> $O
          curl -sL --max-time 180 -o igra.zip "https://www.ncei.noaa.gov/data/integrated-global-radiosonde-archive/access/data-por/ITM00016320-data.txt.zip"; echo "== IGRA2 Brindisi intero: $(wc -c < igra.zip) byte" >> $O
          unzip -p igra.zip 2>/dev/null | awk '/^#ITM00016320 2021 12 29 12/{f=1;print;next} /^#/{if(f)exit} f' | head -40 >> $O
          # GFS d'archivio lungo IC8TEM JN70CN -> IK1PAG JN35TB il 29/12/2021
          python3 .github/gfs_caso.py >> $O 2>&1
          cat $O
      - name: Salva
        shell: bash
        run: |
          git init -q r && cd r && cp ../esito.txt . 
          git config user.name "IC8TEM"; git config user.email "ic8tem@users.noreply.github.com"
          git checkout -q -b ci-dati && git add esito.txt && git commit -qm "prova accesso archivi"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-dati
