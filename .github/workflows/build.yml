# LIVETROPOVHF - compilazione e installatori per Windows, Linux, Raspberry Pi e Mac (come YA-MS).
# A ogni push sul ramo main: solo compilazione di controllo su Linux (i minuti Mac costano 10 volte, Windows 2 volte).
# Con un push sul ramo release (o un tag vX.Y.Z, o avviandolo a mano): installatori per Windows, Linux e Mac;
# con il ramo release o il tag crea anche la Release vX.Y.Z (versione letta dal file VERSION).
name: build

on:
  push:
    branches: [ main, release ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - rid: win-x64
            arch: x64
          - rid: win-x86      # Windows a 32 bit
            arch: x86
          - rid: win-arm64    # Windows su ARM (PC con Snapdragon)
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Versione
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "VER=$V" >> $GITHUB_ENV
      - name: Compila
        run: dotnet publish TropoVHF/TropoVHF.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=${{ env.VER }} -p:DebugType=none -o publish/${{ matrix.rid }}
      - name: Installatore (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc "/DAppVersion=${{ env.VER }}" "/DArch=${{ matrix.arch }}" "/DSourceDir=..\publish\${{ matrix.rid }}" installer\LIVETROPOVHF.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Zip portatile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish\${{ matrix.rid }}\* -DestinationPath dist\LIVETROPOVHF-${{ env.VER }}-windows-${{ matrix.arch }}-portatile.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*

  # Windows 7 SP1 e 8.1: programma nativo per .NET Framework 4.8 (WinForms) nella cartella Win7, con lo stesso motore.
  # Si compila anche a ogni push su main, come prova.
  windows7:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            arch: x64
          - rid: win-x86
            arch: x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Versione
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "VER=$V" >> $GITHUB_ENV
      # Windows 7 SP1 e 8.1: programma nativo .NET Framework 4.8 + WinForms (cartella Win7), stesso motore della versione normale
      - name: Compila (.NET Framework 4.8)
        shell: bash
        run: |
          set -o pipefail
          dotnet publish Win7/LIVETROPOVHF7.csproj -c Release -r ${{ matrix.rid }} -p:Version=${{ env.VER }} -p:DebugType=none -o publish/w7-${{ matrix.rid }} -clp:NoSummary 2>&1 | tee build-w7.log
      - name: Errori di compilazione (ramo ci-log)
        if: failure() && matrix.arch == 'x64'
        shell: bash
        run: |
          grep -E ": error |error NU|error MSB" build-w7.log | sort -u > errori.txt || true
          cp build-w7.log tutto.txt
          git config user.name "IC8TEM"; git config user.email "ic8tem@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          git add -f errori.txt tutto.txt
          git commit -m "errori di compilazione Windows 7 ($GITHUB_SHA)"
          git push -f origin ci-log
      - name: Controllo dei file
        shell: pwsh
        run: |
          Get-ChildItem publish\w7-${{ matrix.rid }} | Format-Table Name, Length
          if (-not (Test-Path publish\w7-${{ matrix.rid }}\LIVETROPOVHF.exe)) { throw "manca LIVETROPOVHF.exe" }
          $names = (Get-ChildItem -Recurse -File publish\w7-${{ matrix.rid }} | ForEach-Object { $_.FullName.Substring((Resolve-Path publish\w7-${{ matrix.rid }}).Path.Length + 1) + " " + $_.Length }) -join ", "
          Write-Output "::notice title=File windows7 ${{ matrix.arch }}::$names"
      - name: Installatore (Inno Setup)
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc "/DAppVersion=${{ env.VER }}" "/DArch=${{ matrix.arch }}" "/DFlavor=windows7" "/DSourceDir=..\publish\w7-${{ matrix.rid }}" installer\LIVETROPOVHF.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Zip portatile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish\w7-${{ matrix.rid }}\* -DestinationPath dist\LIVETROPOVHF-${{ env.VER }}-windows7-${{ matrix.arch }}-portatile.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows7-${{ matrix.arch }}
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Versione
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "VER=$V" >> $GITHUB_ENV
      - name: Compila
        run: dotnet publish TropoVHF/TropoVHF.csproj -c Release -r linux-x64 --self-contained true -p:Version=$VER -p:DebugType=none -o publish/linux-x64
      - name: Pacchetto
        run: |
          mkdir -p dist pkg
          cp -R publish/linux-x64 pkg/LIVETROPOVHF
          cp installer/linux-install.sh pkg/LIVETROPOVHF/installa.sh
          cp TropoVHF/Assets/livetropovhf-256.png pkg/LIVETROPOVHF/livetropovhf.png
          chmod +x pkg/LIVETROPOVHF/installa.sh pkg/LIVETROPOVHF/LIVETROPOVHF
          tar -C pkg -czf dist/LIVETROPOVHF-$VER-linux-x64.tar.gz LIVETROPOVHF
          bash installer/make-deb.sh linux-x64 "$VER" publish/linux-x64 dist
          sudo apt-get install -y -qq rpm >/dev/null
          bash installer/make-rpm.sh linux-x64 "$VER" dist/livetropovhf_${VER}_amd64.deb dist
          bash installer/make-txz.sh linux-x64 "$VER" dist/livetropovhf_${VER}_amd64.deb dist
          bash installer/make-arch.sh linux-x64 "$VER" dist/livetropovhf_${VER}_amd64.deb dist
          bash installer/make-appimage.sh linux-x64 "$VER" publish/linux-x64 dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  raspberry:
    # Raspberry Pi 3/4/5 e 400/500: 64 bit (linux-arm64, Raspberry Pi OS 64 bit) e 32 bit (linux-arm, Raspberry Pi OS 32 bit).
    # Il 64 bit si compila su un processore ARM vero.
    strategy:
      matrix:
        include:
          - rid: linux-arm64
            name: raspberry-pi-64bit
            generic: linux-arm64      # stesso programma per ogni Linux ARM64 (es. Slackware ARM64)
            os: ubuntu-24.04-arm
          - rid: linux-arm
            name: raspberry-pi-32bit
            generic: linux-armv7l     # stesso programma per ogni Linux armv7l (armhf)
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Versione
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "VER=$V" >> $GITHUB_ENV
      - name: Compila
        run: dotnet publish TropoVHF/TropoVHF.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=$VER -p:DebugType=none -o publish/${{ matrix.rid }}
      - name: Pacchetto
        run: |
          mkdir -p dist pkg
          cp -R publish/${{ matrix.rid }} pkg/LIVETROPOVHF
          cp installer/linux-install.sh pkg/LIVETROPOVHF/installa.sh
          cp TropoVHF/Assets/livetropovhf-256.png pkg/LIVETROPOVHF/livetropovhf.png
          chmod +x pkg/LIVETROPOVHF/installa.sh pkg/LIVETROPOVHF/LIVETROPOVHF
          tar -C pkg -czf dist/LIVETROPOVHF-$VER-${{ matrix.name }}.tar.gz LIVETROPOVHF
          tar -C pkg -czf dist/LIVETROPOVHF-$VER-${{ matrix.generic }}.tar.gz LIVETROPOVHF
          bash installer/make-deb.sh ${{ matrix.rid }} "$VER" publish/${{ matrix.rid }} dist
          sudo apt-get install -y -qq rpm >/dev/null
          if [ "${{ matrix.rid }}" = "linux-arm64" ]; then
            bash installer/make-rpm.sh linux-arm64 "$VER" dist/livetropovhf_${VER}_arm64.deb dist
            bash installer/make-txz.sh linux-arm64 "$VER" dist/livetropovhf_${VER}_arm64.deb dist
            bash installer/make-arch.sh linux-arm64 "$VER" dist/livetropovhf_${VER}_arm64.deb dist
            bash installer/make-appimage.sh linux-arm64 "$VER" publish/linux-arm64 dist
          else
            bash installer/make-rpm.sh linux-arm "$VER" dist/livetropovhf_${VER}_armhf.deb dist
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  alpine:
    # Alpine Linux e altre distribuzioni con musl (x86_64 e aarch64).
    strategy:
      matrix:
        include:
          - rid: linux-musl-x64
            name: alpine-x64
            os: ubuntu-latest
          - rid: linux-musl-arm64
            name: alpine-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Versione
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "VER=$V" >> $GITHUB_ENV
      - name: Compila
        run: dotnet publish TropoVHF/TropoVHF.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=$VER -p:DebugType=none -o publish/${{ matrix.rid }}
      - name: Pacchetto
        run: |
          mkdir -p dist pkg
          cp -R publish/${{ matrix.rid }} pkg/LIVETROPOVHF
          cp installer/linux-install.sh pkg/LIVETROPOVHF/installa.sh
          cp TropoVHF/Assets/livetropovhf-256.png pkg/LIVETROPOVHF/livetropovhf.png
          chmod +x pkg/LIVETROPOVHF/installa.sh pkg/LIVETROPOVHF/LIVETROPOVHF
          tar -C pkg -czf dist/LIVETROPOVHF-$VER-${{ matrix.name }}.tar.gz LIVETROPOVHF
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  macos:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        rid: [ osx-arm64, osx-x64 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Versione
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "VER=$V" >> $GITHUB_ENV
      - name: Compila
        run: dotnet publish TropoVHF/TropoVHF.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=$VER -p:DebugType=none -o publish/${{ matrix.rid }}
      - name: Pacchetto LIVETROPOVHF.app e immagine disco
        run: |
          APP=pkg/LIVETROPOVHF/LIVETROPOVHF.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist
          cp -R publish/${{ matrix.rid }}/. "$APP/Contents/MacOS/"
          mkdir -p icon.iconset
          for z in 16 32 64 128 256 512; do sips -z $z $z TropoVHF/Assets/livetropovhf-512.png --out icon.iconset/icon_${z}x${z}.png >/dev/null; done
          cp icon.iconset/icon_32x32.png icon.iconset/icon_16x16@2x.png; cp icon.iconset/icon_64x64.png icon.iconset/icon_32x32@2x.png
          cp icon.iconset/icon_256x256.png icon.iconset/icon_128x128@2x.png; cp icon.iconset/icon_512x512.png icon.iconset/icon_256x256@2x.png
          rm icon.iconset/icon_64x64.png
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/livetropovhf.icns"
          sed "s/__VERSION__/$VER/g" installer/Info.plist > "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/LIVETROPOVHF"
          codesign --force --deep -s - "$APP"
          cp "installer/macos-install.command" "pkg/LIVETROPOVHF/Installa LIVETROPOVHF.command"
          chmod +x "pkg/LIVETROPOVHF/Installa LIVETROPOVHF.command"
          cp LEGGIMI.txt pkg/LIVETROPOVHF/
          ARCH=$([ "${{ matrix.rid }}" = "osx-arm64" ] && echo "apple-silicon" || echo "intel")
          hdiutil create -volname "LIVETROPOVHF" -srcfolder pkg/LIVETROPOVHF -ov -format UDZO "dist/LIVETROPOVHF-$VER-mac-$ARCH.dmg"
          # stessa applicazione in uno zip: si estrae dove si vuole, impostazioni e dati nascono accanto a LIVETROPOVHF.app
          ditto -c -k --keepParent "$APP" "dist/LIVETROPOVHF-$VER-mac-$ARCH-app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rid }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
    needs: [ windows, windows7, linux, raspberry, alpine, macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versione
        run: echo "VER=$(tr -d ' \r\n' < VERSION)" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: LIVETROPOVHF ${{ env.VER }}
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          body: |
            LIVETROPOVHF - previsione e osservazione in tempo reale della propagazione troposferica da 144 MHz in su.
            A cura di Costantino IC8TEM. Novità: vedi CHANGELOG.md.
            Il programma si aggiorna da solo da GitHub (controllo ogni 30 minuti, nuova versione attiva al riavvio).

            - Windows 10 e 11: LIVETROPOVHF-...-windows-x64-setup.exe (installa in C:\LIVETROPOVHF) oppure lo zip portatile; per Windows a 32 bit i file -windows-x86-, per Windows su ARM i file -windows-arm64-.
            - Windows 7 SP1 e 8.1: i file -windows7-x64- o -windows7-x86- (setup o zip portatile), compilati su .NET 6; senza la lettura OCR delle mappe.
            - Linux (Debian, Ubuntu, Mint): livetropovhf_..._amd64.deb, con: sudo apt install ./livetropovhf_..._amd64.deb (al primo avvio il programma si copia in ~/LIVETROPOVHF). Oppure LIVETROPOVHF-...-linux-x64.tar.gz, portatile o installabile con ./installa.sh.
            - Fedora, openSUSE: livetropovhf-....x86_64.rpm (o .aarch64.rpm, .armv7hl.rpm).
            - Arch, Manjaro, EndeavourOS: livetropovhf-...-x86_64.pkg.tar.zst (o -aarch64), con sudo pacman -U.
            - Slackware: installpkg livetropovhf-...-x86_64-1_ic8tem.txz (o -aarch64-).
            - Qualsiasi Linux: LIVETROPOVHF-...-x86_64.AppImage (o -aarch64).
            - Alpine Linux (musl): LIVETROPOVHF-...-alpine-x64.tar.gz o -alpine-arm64.tar.gz (serve apk add icu-libs fontconfig).
            - Raspberry Pi 3/4/5: livetropovhf_..._arm64.deb (64 bit) o livetropovhf_..._armhf.deb (32 bit), oppure i tar.gz -raspberry-pi-64bit / -32bit.
            - Mac: LIVETROPOVHF-...-mac-apple-silicon.dmg o -mac-intel.dmg: aprire il .dmg, clic destro su "Installa LIVETROPOVHF.command" > Apri; oppure l'app.zip.
          files: dist/*
      - name: Togli dalla Release i file che non sono pacchetti
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "v$VER" --json assets -q '.assets[].name' | grep -v -e '^LIVETROPOVHF-' -e '^livetropovhf_' -e '^livetropovhf-' | while read -r n; do
            gh release delete-asset "v$VER" "$n" -y
          done
