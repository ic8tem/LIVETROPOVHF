# Raccolta giornaliera dell'archivio di addestramento del modello statistico delle aperture tropo (sperimentale, 1.4).
# Ogni giorno scarica un'altra parte del GFS d'archivio (Open-Meteo consente circa 10 000 chiamate pesate al giorno)
# e la registra sul ramo «addestramento». Quando il GFS è completo crea la tabella delle tratte e addestra il modello,
# poi scrive archivio/completato.txt e da allora non fa più nulla.
name: addestramento-giornaliero
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: addestramento
jobs:
  giro:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: addestramento
      - name: già completato?
        id: stato
        run: |
          if [ -f archivio/completato.txt ]; then echo "fatto=1" >> "$GITHUB_OUTPUT"; else echo "fatto=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.stato.outputs.fatto == '0'
        with:
          ref: privato
          path: src
      - uses: actions/setup-dotnet@v4
        if: steps.stato.outputs.fatto == '0'
        with:
          dotnet-version: '10.0.x'
      - name: compila lo strumento
        if: steps.stato.outputs.fatto == '0'
        run: dotnet build -c Release src/tools/addestramento/addestramento.csproj -o bin
      - name: GFS d'archivio, poi tabella e modello quando è completo
        if: steps.stato.outputs.fatto == '0'
        run: |
          mkdir -p archivio
          echo "== gfs archivio 9000 ($(date -u +%F))" | tee -a archivio/registro.txt
          dotnet bin/addestramento.dll gfs archivio 9000 < /dev/null 2>&1 | tee -a archivio/registro.txt
          if tail -1 archivio/registro.txt | grep -q "tutto scaricato"; then
            echo "== dataset archivio" | tee -a archivio/registro.txt
            dotnet bin/addestramento.dll dataset archivio < /dev/null 2>&1 | tee -a archivio/registro.txt
            echo "== addestra archivio" | tee -a archivio/registro.txt
            dotnet bin/addestramento.dll addestra archivio < /dev/null 2>&1 | tee -a archivio/registro.txt
            [ -f archivio/rapporto.md ] && date -u +%F > archivio/completato.txt
          fi
      - name: registra
        if: always() && steps.stato.outputs.fatto == '0'
        run: |
          rm -rf src bin
          git config user.name IC8TEM
          git config user.email ic8tem@users.noreply.github.com
          git add archivio
          git commit -q -m "Archivio di addestramento, giro giornaliero (run ${{ github.run_id }})" || echo nulla
          git push
